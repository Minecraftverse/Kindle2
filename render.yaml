services:
  - type: web
    name: kindle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HORT_TZ
        value: Europe/Zurich
      - key: DATABASE_URL
        sync: false   # Neon-Verbindungsadresse, wird beim Einrichten eingegeben
      - key: FEEDBACK_EMAIL
        sync: false   # E-Mail-Adresse für Rückmeldungen (optional)
