<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hort Manager</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--tx:#14262e;--mu:#62767f;--ac:#0f6b8a;--ln:#d5dee2;--bad:#b42318;--warn:#a65b00;--ok:#1b7a3d;--okbg:#e2f4e8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1f;--card:#17252c;--tx:#e6eef1;--mu:#94a9b2;--ac:#5cc3e4;--ln:#2a3d46;--bad:#ff8a80;--warn:#ffc266;--ok:#6fdc97;--okbg:#17372a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--ln)}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}header b{font-size:1.15rem}
.sp{flex:1}
#tabs{display:flex;gap:6px;margin-bottom:8px}
#tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);font-weight:600;cursor:pointer}
#tabs button.on{background:var(--ac);color:#fff}
#q{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin-bottom:8px}
#chips{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding-bottom:4px}
.chip{border:1.5px solid var(--c,var(--ln));background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--c,var(--ac));border-color:var(--c,var(--ac));color:#fff}
#main{padding:12px;max-width:980px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
.card.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.card.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:150px;z-index:4;border:2px solid var(--ac)}
.li{padding:3px 0}.mu{color:var(--mu);font-size:.9rem}
details{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:color-mix(in srgb,var(--ac) 10%,var(--card))}
summary .chip{margin-left:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--ln)}
.row input[type=checkbox]{width:22px;height:22px;flex:none}
.nm{flex:1;min-width:0}
.row select{padding:8px;border:2px solid var(--ln);border-radius:8px;background:var(--card)}
.b{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:.78rem;font-weight:600}
.b.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.b.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.mealsw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mealsw button{padding:14px;border:2px solid var(--ln);border-radius:14px;background:var(--card);cursor:pointer;font-size:1.05rem}
.mealsw button b{font-size:1.6rem}
.mealsw button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tools{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.gh{display:flex;align-items:center;gap:8px;margin:14px 0 6px}.gh .chip{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{position:relative;text-align:left;padding:10px 10px 10px 36px;min-height:56px;border:2px solid var(--ln);border-radius:12px;background:var(--card);cursor:pointer}
.tile .ck{position:absolute;left:9px;top:11px;width:20px;height:20px;border:2px solid var(--ln);border-radius:6px;font-size:.85rem;line-height:16px;text-align:center;color:#fff}
.tile.ate{background:var(--okbg);border-color:var(--ok)}.tile.ate .ck{background:var(--ok);border-color:var(--ok)}
.tile.away{opacity:.55}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.card input:not([type=checkbox]),textarea{padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);width:100%}
textarea{margin:8px 0}
.pri{padding:10px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.auth{max-width:360px;margin:12vh auto 0;display:grid;gap:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;transition:transform .25s;z-index:9}
#toast.show{transform:translate(-50%,0)}
html[data-theme=wald]{--ac:#2f7d4f}html[data-theme=himmel]{--ac:#0f6b8a}html[data-theme=sonne]{--ac:#a8680a}html[data-theme=beere]{--ac:#a23b72}html[data-theme=kontrast]{--ac:#000;--ln:#000;--tx:#000;--bg:#fff;--card:#fff;--mu:#222}
@media(prefers-color-scheme:dark){html[data-theme=wald]{--ac:#5fbf84}html[data-theme=himmel]{--ac:#5cc3e4}html[data-theme=sonne]{--ac:#f5b942}html[data-theme=beere]{--ac:#e07bb0}html[data-theme=kontrast]{--ac:#fff;--ln:#fff;--tx:#fff;--bg:#000;--card:#000;--mu:#ddd}}
html[data-theme=ozean]{--ac:#1d4ed8;--bg:#e8eefb}
html[data-theme=lavendel]{--ac:#6d4bc3;--bg:#f1edfa}
html[data-theme=korall]{--ac:#d6493d;--bg:#fbefec}
html[data-theme=mint]{--ac:#0f8f74;--bg:#e6f6f1}
html[data-theme=schoggi]{--ac:#8a5a3c;--bg:#f4ede6}
html[data-theme=bonbon]{--ac:#d6409f;--bg:#fdeef7}
@media(prefers-color-scheme:dark){
html[data-theme=ozean]{--ac:#7aa2ff;--bg:#0c1426;--card:#131d36;--ln:#25335a}
html[data-theme=lavendel]{--ac:#b59cff;--bg:#17132a;--card:#211b3b;--ln:#382f5e}
html[data-theme=korall]{--ac:#ff8f84;--bg:#1f1412;--card:#2b1c19;--ln:#4a2e29}
html[data-theme=mint]{--ac:#5be0bd;--bg:#0d1b18;--card:#14282a;--ln:#244a45}
html[data-theme=schoggi]{--ac:#d9a47c;--bg:#1a1410;--card:#261d17;--ln:#43342a}
html[data-theme=bonbon]{--ac:#ff7ccd;--bg:#1e1019;--card:#2c1726;--ln:#4b2a41}}
html[data-theme=nacht]{--ac:#79c0ff;--bg:#0b0f14;--card:#131a22;--tx:#e6edf3;--mu:#8b9bab;--ln:#26323f;--bad:#ff8a80;--warn:#ffc266;--ok:#6fdc97;--okbg:#17372a;color-scheme:dark}
.chip.on:not([style*="--c"]){color:var(--bg)}
html.simple body{font-size:21px}html.simple .mu{display:none}html.simple .chip,html.simple .row select{min-height:44px}
#tabs{overflow-x:auto}#tabs button{flex:1 0 auto;padding:10px 12px;white-space:nowrap}
.pri,#tabs button.on{color:var(--bg)}
.card select{padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.card input[type=radio],.card input[type=color],.card input[type=file]{width:auto;padding:0;border:0;background:none}
.row{flex-wrap:wrap}.row input:not([type=checkbox]):not([type=radio]):not([type=color]){flex:1;width:auto;min-width:90px}
.form textarea{grid-column:1/-1}
dialog.card{margin:auto;width:min(640px,94vw);max-height:90vh;overflow:auto;border:0;color:var(--tx)}
dialog::backdrop{background:#0008}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:8px}h4{margin:14px 0 6px}
</style><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0f6b8a"></head><body>
<div id="app"></div><dialog id="dlg" class="card"></dialog><div id="toast"></div>
<script>
const T={de:{roster:'Übersicht',meals:'Essen',manage:'Kinder',search:'Kind suchen…',all:'Alle',att:'Bald im Termin',in:'in',min:'Min.',inAppt:'im Termin',sel:'gewählt',clear:'Aufheben',selGrp:'Gruppe wählen',here:'anwesend',lunch:'Mittagessen',zvieri:'Zvieri',open:'Noch offen',onlyOpen:'Nur offene',onlyHere:'Nur Anwesende',allDone:'Alle haben gegessen 🎉',allTick:'Alle ✓',add:'Kind hinzufügen',first:'Vorname',last:'Nachname',group:'Gruppe',allergies:'Allergien',imp:'CSV importieren',impHint:'Spalten: vorname, nachname, gruppe. Weitere Spalten werden als Info gespeichert.',logout:'Abmelden',login:'Anmelden',user:'Benutzername',pw:'Passwort',setup:'Hort einrichten',hname:'Name des Horts',yname:'Dein Name',demo:'Beispieldaten laden',none:'Keine Kinder gefunden.',del:'Kind wirklich löschen?',added:'neu',skipped:'übersprungen',ok:'Gespeichert ✓',err:'Eingabe ungültig',addItem:'Hinzufügen',addPlan:'Programm oder Mittagessen hinzufügen',backup:'Backup herunterladen',plan:'Wochenplan',log:'Protokoll',settings:'Einstellungen',save:'Speichern',title:'Titel',prog:'Programm',note:'Notiz',appts:'Termine',today:'Heute',recur:'Jede Woche',info:'Infos (eine Zeile pro Eintrag, z. B. Allergien: Nüsse)',hort:'Hort',theme:'Farbe',simple:'Einfacher Modus (grosse Schrift)',logo:'Logo',users:'Konten',manager:'Leitung',staff:'Mitarbeitende',pwNew:'Neues Passwort',statuses:'Status',types:'Terminarten',name:'Name',sure:'Wirklich löschen?'},
en:{roster:'Overview',meals:'Meals',manage:'Children',search:'Find child…',all:'All',att:'Appointments soon',in:'in',min:'min',inAppt:'at appointment',sel:'selected',clear:'Clear',selGrp:'Select group',here:'present',lunch:'Lunch',zvieri:'Afternoon snack',open:'Still missing',onlyOpen:'Only missing',onlyHere:'Only present',allDone:'Everyone has eaten 🎉',allTick:'All ✓',add:'Add child',first:'First name',last:'Last name',group:'Group',allergies:'Allergies',imp:'Import CSV',impHint:'Columns: first name, last name, group. Other columns are kept as info.',logout:'Log out',login:'Log in',user:'Username',pw:'Password',setup:'Set up Hort',hname:'Hort name',yname:'Your name',demo:'Load sample data',none:'No children found.',del:'Really delete this child?',added:'new',skipped:'skipped',ok:'Saved ✓',err:'Invalid input',addItem:'Add',addPlan:'Add programme or lunch',backup:'Download backup',plan:'Weekly plan',log:'Log',settings:'Settings',save:'Save',title:'Title',prog:'Programme',note:'Note',appts:'Appointments',today:'Today',recur:'Every week',info:'Info (one per line, e.g. Allergies: nuts)',hort:'Hort',theme:'Colour',simple:'Simple mode (large text)',logo:'Logo',users:'Accounts',manager:'Manager',staff:'Staff',pwNew:'New password',statuses:'Statuses',types:'Appointment types',name:'Name',sure:'Really delete?'}};
let L='de',tok=localStorage.getItem('hm_tok'),S={},kids=[],sts=[],meals={},tab='roster',q='',grp='',stf='',sel=new Set(),meal='lunch',onlyOpen=false,onlyHere=false,col=new Set(),me={},types=[],users=[],plan=[],logs=[],cur=0;
const t=k=>T[L][k]||k,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2500)}
async function api(p,m='GET',b){
 const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});
 if(r.status===401&&p!=='login'&&p!=='logout'){logout();throw 0}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:t('err'));
 return j}
async function logout(){try{await api('logout','POST')}catch{}tok=null;localStorage.removeItem('hm_tok');boot()}
async function load(){
 [kids,sts,meals,plan,logs]=await Promise.all([api('roster'),api('statuses'),api('meals'),api('weekly-plan'),api('logs')]);
 kids.sort((a,b)=>(a.group_name||'').localeCompare(b.group_name||'')||a.first_name.localeCompare(b.first_name))}
const G=k=>k.group_name||'–';
const cf=(k,re)=>{for(const[a,b]of Object.entries(k.custom_fields||{}))if(re.test(a)&&b)return b;return ''};
const here=k=>k.status&&!k.status.is_default&&!/abwes|absent|abgeholt|picked/i.test(k.status.label);
const ate=(k,m)=>!!(meals[k.id]&&meals[k.id][m]);
const short=k=>esc(k.first_name)+' '+esc(k.last_name[0])+'.';
const vis=()=>kids.filter(k=>(!grp||G(k)===grp)&&(!q||(k.first_name+' '+k.last_name).toLowerCase().includes(q)));
const groups=()=>[...new Set(kids.map(G))].sort();
const byGroup=l=>l.reduce((o,k)=>((o[G(k)]=o[G(k)]||[]).push(k),o),{});
const badges=k=>{const a=cf(k,/allerg/i),d=cf(k,/ernähr|dietary/i);return(a?`<span class="b bad">⚠ ${esc(a)}</span>`:'')+(d?`<span class="b warn">${esc(d)}</span>`:'')};

function authView(su){
 $('#app').innerHTML=`<form class="card auth" id="af"><h2>${esc(S.hort_name)}</h2>${su?`<input name="hort_name" placeholder="${t('hname')}" required><input name="name" placeholder="${t('yname')}" required>`:''}<input name="username" placeholder="${t('user')}" required autocomplete="username"><input name="password" type="password" placeholder="${t('pw')}" required minlength="8" autocomplete="current-password">${su?`<select name="language"><option value="de">Deutsch</option><option value="en">English</option></select><label><input type="checkbox" name="demo"> ${t('demo')}</label>`:''}<button class="pri">${su?t('setup'):t('login')}</button></form>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  try{const r=su?await api('setup','POST',{hort_name:f.get('hort_name'),logo:'',theme:'wald',language:f.get('language'),simple_mode:false,name:f.get('name'),username:f.get('username'),password:f.get('password'),demo:f.has('demo')}):await api('login','POST',{username:f.get('username'),password:f.get('password')});
   tok=r.token;localStorage.setItem('hm_tok',tok);boot()}catch(err){toast(err.message)}}}

function shell(){
 $('#app').innerHTML=`<div class="top"><header>${S.logo?`<img src="${esc(S.logo)}" alt="" style="height:30px;border-radius:6px">`:''}<b>${esc(S.hort_name)}</b><span class="sp"></span>${S.feedback_email?`<a class="chip" href="mailto:${esc(S.feedback_email)}?subject=Kindle%20Feedback%20v${esc(S.version)}" style="text-decoration:none;color:inherit">✉ Feedback</a>`:''}<button class="chip" data-logout>${t('logout')}</button></header><div id="tabs"></div><input id="q" type="search" placeholder="${t('search')}"><div id="chips"></div></div><div id="main"></div>`;
 $('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw()}}

function draw(){
 $('#tabs').innerHTML=tabList().map(x=>`<button class="${tab==x?'on':''}" data-tab="${x}">${t(x)}</button>`).join('');
 const inG=kids.filter(k=>!grp||G(k)===grp);
 $('#chips').innerHTML=`<button class="chip ${grp?'':'on'}" data-grp="">${t('all')} ${kids.length}</button>`+groups().map(g=>`<button class="chip ${grp==g?'on':''}" data-grp="${esc(g)}">${esc(g)} ${kids.filter(k=>G(k)==g).length}</button>`).join('')+(tab=='roster'?sts.map(s=>`<button class="chip ${stf==s.id?'on':''}" data-st="${s.id}" style="--c:${esc(s.color_code)}">${esc(s.icon)} ${esc(s.label)} ${inG.filter(k=>k.status&&k.status.id==s.id).length}</button>`).join(''):'');
 $('#main').innerHTML={roster:vRoster,meals:vMeals,manage:vManage,plan:vPlan,log:vLog,settings:vSettings}[tab]();const flt=['roster','meals','manage'].includes(tab);$('#chips').style.display=$('#q').style.display=flt?'':'none'}

const row=k=>`<div class="row"><input type="checkbox" data-sel="${k.id}" ${sel.has(k.id)?'checked':''} aria-label="${esc(k.first_name)}"><div class="nm" data-open="${k.id}"><b>${esc(k.first_name)} ${esc(k.last_name)}</b>${badges(k)}${k.last_note?`<div class="mu">📝 ${esc(k.last_note.note)}</div>`:''}</div><select data-set="${k.id}" style="border-color:${k.status?esc(k.status.color_code):'var(--ln)'}">${sts.map(s=>`<option value="${s.id}" ${k.status&&k.status.id==s.id?'selected':''}>${esc(s.icon)} ${esc(s.label)}</option>`).join('')}</select></div>`;

const beeped=new Set();let ac;
document.addEventListener('click',()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)()},{once:true});
function alertSound(list){list.forEach(({k,a})=>{if(a.state=='upcoming'&&a.minutes_until<=5){const key=k.id+a.title+new Date().toDateString();if(beeped.has(key))return;beeped.add(key);if(navigator.vibrate)navigator.vibrate([200,100,200]);if(ac){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(ac.currentTime+.4)}}})}
let audit=[];
function vRoster(){
 const att=kids.flatMap(k=>k.appointments.filter(a=>a.state=='upcoming'||a.state=='away').map(a=>({k,a}))).sort((x,y)=>x.a.minutes_until-y.a.minutes_until);
 let h='';
 alertSound(att);const out=kids.filter(k=>k.handover&&!k.handover.back_at),de=L=='de';
const hb=(k,a)=>{const x=k.handover;if(x&&!x.back_at)return '';return (a.state=='away'&&!x?`<b style="color:var(--bad)"> ⚠ ${de?'nicht losgeschickt!':'not sent yet!'}</b>`:'')+` <button class="chip" data-ho="out:${k.id}">${de?'Übergeben ✓':'Handed over ✓'}</button>`};
if(att.length||out.length)h+=`<div class="card"><b>🔔 ${t('att')}</b>${att.map(({k,a})=>`<div class="li"${a.state=='upcoming'&&a.minutes_until<=5?' style="color:var(--bad);font-weight:700"':''}><span style="color:${esc(a.color)}">●</span> ${short(k)} – ${esc(a.title)} <span class="mu">${a.state=='away'?t('inAppt'):t('in')+' '+a.minutes_until+' '+t('min')}</span>${hb(k,a)}</div>`).join('')}${out.map(k=>`<div class="li">🚶 ${short(k)} <span class="mu">${de?'unterwegs seit':'out since'} ${k.handover.left_at.slice(11,16)} ${esc(k.handover.left_with||'')}</span> <button class="chip" data-ho="back:${k.id}">${de?'Zurück ✓':'Back ✓'}</button></div>`).join('')}</div>`;
 if(sel.size)h+=`<div class="card bulk"><b>${sel.size} ${t('sel')}</b>${sts.map(s=>`<button class="chip" data-bulk="${s.id}" style="--c:${esc(s.color_code)}">${esc(s.icon)} ${esc(s.label)}</button>`).join('')}<button class="chip" data-clear>${t('clear')}</button></div>`;
 const list=vis().filter(k=>!stf||(k.status&&k.status.id==stf));
 if(!list.length)return h+`<p class="mu">${t('none')}</p>`;
 return h+Object.entries(byGroup(list)).map(([g,ks])=>`<details ${col.has(g)?'':'open'} data-g="${esc(g)}"><summary><b>${esc(g)}</b><span class="mu">${ks.filter(here).length}/${ks.length} ${t('here')}</span><button class="chip" data-selgrp="${esc(g)}">${t('selGrp')}</button></summary>${ks.map(row).join('')}</details>`).join('')}

function vMeals(){
 const pool=vis().filter(k=>!onlyHere||here(k)),all=kids.filter(k=>!onlyHere||here(k));
 const missing=all.filter(k=>!ate(k,meal)),done=all.length-missing.length;
 let h=`<div class="mealsw">${['lunch','zvieri'].map(m=>`<button class="${meal==m?'on':''}" data-meal="${m}">${m=='lunch'?'🍝':'🍎'} ${t(m)}<br><b>${all.filter(k=>ate(k,m)).length}/${all.length}</b></button>`).join('')}</div>`;
 h+=`<div class="bar"><i style="width:${all.length?done/all.length*100:0}%"></i></div>`;
 h+=`<div class="tools"><label><input type="checkbox" data-oh ${onlyHere?'checked':''}> ${t('onlyHere')}</label><label><input type="checkbox" data-oo ${onlyOpen?'checked':''}> ${t('onlyOpen')}</label></div>`;
 h+=missing.length?`<div class="card"><b>${t('open')} (${missing.length})</b><div class="mu">${missing.length<=15?missing.map(short).join(', '):''}</div></div>`:`<div class="card ok">${t('allDone')}</div>`;
 const list=pool.filter(k=>!onlyOpen||!ate(k,meal));
 return h+Object.entries(byGroup(list)).map(([g,ks])=>`<div class="gh"><b>${esc(g)}</b><span class="mu">${ks.filter(k=>ate(k,meal)).length}/${ks.length}</span><button class="chip" data-mgrp="${esc(g)}">${t('allTick')}</button></div><div class="grid">${ks.map(k=>`<button class="tile ${ate(k,meal)?'ate':''} ${here(k)?'':'away'}" data-tog="${k.id}"><span class="ck">${ate(k,meal)?'✓':''}</span><b>${esc(k.first_name)}</b> ${esc(k.last_name)}<br>${badges(k)}</button>`).join('')}</div>`).join('')}

function vManage(){
 return `<div class="card"><b>${t('add')}</b><div class="form"><input id="nf" placeholder="${t('first')}"><input id="nl" placeholder="${t('last')}"><input id="ng" list="gl" placeholder="${t('group')}"><datalist id="gl">${groups().map(g=>`<option value="${esc(g)}">`).join('')}</datalist><input id="na" placeholder="${t('allergies')}"><button class="pri" data-add>${t('add')}</button></div></div>
 <div class="card"><b>${t('imp')}</b><div class="mu">${t('impHint')}</div><input type="file" id="cf" accept=".csv,.txt"><textarea id="ct" rows="4" placeholder="vorname;nachname;gruppe;Allergien"></textarea><button class="pri" data-imp>${t('imp')}</button></div>
 <div class="card"><button class="pri" data-backup>${t('backup')}</button></div>
 <div class="card">${vis().map(k=>`<div class="row"><div class="nm" data-open="${k.id}"><b>${esc(k.first_name)} ${esc(k.last_name)}</b> <span class="mu">${esc(k.group_name)}</span>${badges(k)}</div><button class="chip" data-del="${k.id}" aria-label="delete">🗑</button></div>`).join('')||`<span class="mu">${t('none')}</span>`}</div>`}

async function backup(){
 const r=await fetch('/api/backup',{headers:{Authorization:'Bearer '+tok}});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||t('err'));
 const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');
 a.href=u;a.download='hort-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}
async function setMeal(ids,m,on){
 ids.forEach(i=>{meals[i]=meals[i]||{};on?meals[i][m]=true:delete meals[i][m]});draw();
 try{await api('meals','POST',{child_ids:ids,meal:m,ate:on})}catch(e){toast(e.message);await load();draw()}}

document.addEventListener('click',async e=>{
 const o=e.target.closest('[data-open]');if(o&&!e.target.closest('button,select,input')){openChild(+o.dataset.open).catch(x=>toast(x&&x.message||''));return}
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 try{
  if(d.tab){tab=d.tab;applyS();if(tab=='settings')await loadAdmin();draw()}
  else if('grp' in d){grp=d.grp;draw()}
  else if(d.st){stf=stf==d.st?'':+d.st;draw()}
  else if(d.bulk){await api('attendance/bulk','POST',{child_ids:[...sel],status_id:+d.bulk});sel.clear();await load();draw();toast(t('ok'))}
  else if('clear' in d){sel.clear();draw()}
  else if('selgrp' in d){e.preventDefault();const ids=vis().filter(k=>G(k)==d.selgrp).map(k=>k.id),all=ids.every(i=>sel.has(i));ids.forEach(i=>all?sel.delete(i):sel.add(i));draw()}
  else if(d.meal){meal=d.meal;draw()}
  else if(d.tog){const id=+d.tog;setMeal([id],meal,!(meals[id]&&meals[id][meal]))}
  else if('mgrp' in d){const ks=vis().filter(k=>G(k)==d.mgrp&&(!onlyHere||here(k))),every=ks.every(k=>ate(k,meal));setMeal(ks.filter(k=>every||!ate(k,meal)).map(k=>k.id),meal,!every)}
  else if('add' in d){const f=id=>$('#'+id).value.trim();if(!f('nf')||!f('nl'))return toast(t('err'));await api('children','POST',{first_name:f('nf'),last_name:f('nl'),group_name:f('ng'),custom_fields:f('na')?{[L=='de'?'Allergien':'Allergies']:f('na')}:{}});await load();draw();toast(t('ok'))}
  else if('imp' in d){const r=await api('children/import','POST',{csv_text:$('#ct').value});await load();draw();toast(`${r.added} ${t('added')}, ${r.skipped} ${t('skipped')}`)}
  else if(d.del){if(confirm(t('del'))){await api('children/'+d.del,'DELETE');sel.delete(+d.del);await load();draw()}}
  else if('close' in d)$('#dlg').close();
  else if('savekid' in d){const f=fields(b.closest('[data-box]'));await api('children/'+cur,'PUT',{first_name:f.first_name,last_name:f.last_name,group_name:f.group_name,custom_fields:parseInfo(f.info)});await load();draw();openChild(cur);toast(t('ok'))}
  else if('note' in d){const v=$('#nn').value.trim();if(!v)return;await api('attendance','POST',{child_id:cur,note:v});await load();draw();openChild(cur)}
  else if('addappt' in d){const f=fields(b.closest('[data-box]')),rc=f.is_recurring;await api('appointments','POST',{child_id:cur,title:f.title,category:f.category,is_recurring:rc,day_of_week:rc?f.day_of_week:null,date:rc?null:(f.date||null),start_time:f.start_time,duration_minutes:f.duration_minutes||45,alert_lead_minutes:f.alert_lead_minutes});await load();draw();openChild(cur);toast(t('ok'))}
  else if(d.ho){const[ac2,id]=d.ho.split(':');const p=prompt(L=='de'?(ac2=='out'?'Übergeben an / begleitet von:':'Zurückgebracht von:'):(ac2=='out'?'Handed over to:':'Brought back by:'));if(p===null)return;await api('handover','POST',{child_id:+id,action:ac2,person:p});await load();draw();toast(t('ok'))}

else if(d.mk){await api(d.mk,'POST',fields(b.closest('[data-box]')));await refresh();toast(t('ok'))}
  else if(d.rm){if(confirm(t('sure'))){await api(d.rm,'DELETE');await refresh();if($('#dlg').open)openChild(cur)}}
  else if(d.pw){const p=prompt(t('pwNew'));if(p){await api('users/'+d.pw,'PUT',{...fields(b.closest('[data-ep]')),password:p});toast(t('ok'))}}
  else if('savesettings' in d)await saveSettings(b.closest('[data-box]'));
  else if('backup' in d)await backup();
  else if('logout' in d)logout();
 }catch(err){toast(err&&err.message||'')}});

document.addEventListener('change',async e=>{
 const el=e.target,d=el.dataset;
 try{
  if(el.name&&el.closest('[data-ep]'))await rowSave(el);
  else if(el.name=='theme'&&el.closest('[data-box]'))document.documentElement.dataset.theme=el.value; // live preview
  else if(d.sel){el.checked?sel.add(+d.sel):sel.delete(+d.sel);draw()}
  else if(d.set){await api('attendance','POST',{child_id:+d.set,status_id:+el.value});await load();draw()}
  else if('oh' in d){onlyHere=el.checked;draw()}
  else if('oo' in d){onlyOpen=el.checked;draw()}
  else if(el.id=='lg'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(r.result.length>390000)return toast('Logo < 280 KB');pendingLogo=r.result;toast(t('ok'))};r.readAsDataURL(f)}
  else if(el.id=='cf'){const f=el.files[0];if(f)$('#ct').value=await f.text()}
 }catch(err){toast(err&&err.message||'')}});

document.addEventListener('toggle',e=>{const g=e.target.dataset&&e.target.dataset.g;if(g!==undefined)e.target.open?col.delete(g):col.add(g)},true);

const DAYS={de:['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']},THEMES=['wald','himmel','sonne','beere','ozean','lavendel','korall','mint','schoggi','bonbon','nacht','kontrast'],TL={wald:'🌲 Wald',himmel:'☁️ Himmel',sonne:'☀️ Sonne',beere:'🫐 Beere',ozean:'🌊 Ozean',lavendel:'💜 Lavendel',korall:'🪸 Korall',mint:'🍃 Mint',schoggi:'🍫 Schoggi',bonbon:'🍬 Bonbon',nacht:'🌙 Nacht',kontrast:'◐ Kontrast'};
let pendingLogo=null;
const isMgr=()=>me.role=='manager',tabList=()=>['roster','meals','plan','log','manage',...(isMgr()?['settings']:[])];
function applyS(){document.documentElement.dataset.theme=S.theme||'wald';document.documentElement.classList.toggle('simple',!!S.simple_mode)}
const fields=box=>{const o={};box.querySelectorAll('[name]').forEach(i=>o[i.name]=(i.type=='checkbox'||i.type=='radio')?i.checked:(i.type=='number'||'num' in i.dataset)?+i.value:i.value);return o};
const parseInfo=s=>Object.fromEntries((s||'').split('\n').map(l=>l.split(/:(.*)/s).map(x=>x.trim())).filter(a=>a[0]&&a[1]));
const infoText=k=>Object.entries(k.custom_fields||{}).map(([a,b])=>a+': '+b).join('\n');
async function loadAdmin(){[types,users,audit]=await Promise.all([api('appointment-types'),api('users'),api('audit')])}
async function refresh(){await load();if(tab=='settings')await loadAdmin();draw()}
async function rowSave(el){const row=el.closest('[data-ep]');try{await api(row.dataset.ep+'/'+row.dataset.id,'PUT',fields(row));toast(t('ok'))}catch(e){toast(e.message)}await refresh()}
async function saveSettings(box){const f=fields(box);
 S=await api('settings','PUT',{hort_name:f.hort_name,language:f.language,theme:f.theme,simple_mode:f.simple_mode,logo:pendingLogo??S.logo??''});
 S.configured=true;pendingLogo=null;L=S.language;document.documentElement.lang=L;document.title=S.hort_name;applyS();shell();draw();toast(t('ok'))}

function vPlan(){
 const td=(new Date().getDay()+6)%7;
 const form=isMgr()?`<div class="card" data-box><b>${t('addPlan')}</b><div class="form"><select name="day_of_week" data-num>${DAYS[L].map((x,i)=>`<option value="${i}" ${i==td?'selected':''}>${x}</option>`).join('')}</select><select name="kind"><option value="program">${t('prog')}</option><option value="lunch">${t('lunch')}</option></select><input name="title" placeholder="${t('title')}"><input name="start_time" type="time"><input name="end_time" type="time"><input name="notes" placeholder="${t('note')}"><button class="pri" data-mk="weekly-plan">${t('addItem')}</button></div></div>`:'';
 return form+DAYS[L].map((n,i)=>{const it=plan.filter(p=>p.day_of_week==i).sort((a,b)=>(a.start_time||'').localeCompare(b.start_time||''));if(!it.length&&i>4)return'';
  return `<div class="card" ${i==td?'style="border:2px solid var(--ac)"':''}><b>${n}</b>${it.map(p=>`<div class="li">${p.kind=='lunch'?'🍽':'🎒'} <b>${esc(p.title)}</b> <span class="mu">${p.start_time}${p.end_time?'–'+p.end_time:''} ${esc(p.notes)}</span>${isMgr()?` <button class="chip" data-rm="weekly-plan/${p.id}">🗑</button>`:''}</div>`).join('')||'<div class="mu">–</div>'}</div>`}).join('')}

const vLog=()=>logs.length?`<div class="card">${logs.map(l=>`<div class="li"><span class="mu">${l.timestamp.slice(11,16)}</span> <b>${esc(l.child_name)}</b> ${l.status?esc(l.status.icon)+' '+esc(l.status.label):''} ${l.note?'📝 '+esc(l.note):''}</div>`).join('')}</div>`:`<p class="mu">${t('none')}</p>`;

function vSettings(){
 const ro=(ep,id,a,x)=>`<div class="row" data-ep="${ep}" data-id="${id}">${a}${x}</div>`;
 const sel=(n,v,o)=>`<select name="${n}">${o.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('')}</select>`;
 const roles=[['manager',t('manager')],['staff',t('staff')]];
 return `<div class="card" data-box><b>${t('hort')}</b><div class="form"><input name="hort_name" value="${esc(S.hort_name)}">${sel('language',L,[['de','Deutsch'],['en','English']])}${sel('theme',S.theme||'wald',THEMES.map(x=>[x,TL[x]]))}<label><input type="checkbox" name="simple_mode" ${S.simple_mode?'checked':''}> ${t('simple')}</label><label>${t('logo')} <input type="file" id="lg" accept="image/*"></label><button class="pri" data-savesettings>${t('save')}</button></div></div>
 <div class="card"><b>${t('users')}</b>${users.map(u=>ro('users',u.id,`<input name="name" value="${esc(u.name)}"><input name="username" value="${esc(u.username)}">${sel('role',u.role,roles)}`,`<button class="chip" data-pw="${u.id}">🔑</button><button class="chip" data-rm="users/${u.id}">🗑</button>`)).join('')}<div class="form" data-box><input name="name" placeholder="${t('name')}"><input name="username" placeholder="${t('user')}"><input name="password" type="password" placeholder="${t('pw')}">${sel('role','staff',roles)}<button class="pri" data-mk="users">${t('addItem')}</button></div></div>
 <div class="card"><b>${t('statuses')}</b>${sts.map(s=>ro('statuses',s.id,`<input type="radio" name="is_default" ${s.is_default?'checked':''}><input name="icon" value="${esc(s.icon)}" style="max-width:60px"><input name="label" value="${esc(s.label)}"><input type="color" name="color_code" value="${esc(s.color_code)}">`,s.is_default?'':`<button class="chip" data-rm="statuses/${s.id}">🗑</button>`)).join('')}<div class="form" data-box><input name="icon" placeholder="🙂"><input name="label" placeholder="${t('name')}"><input type="color" name="color_code" value="#64748b"><button class="pri" data-mk="statuses">${t('addItem')}</button></div></div>
 <div class="card"><b>${t('types')}</b>${types.map(y=>ro('appointment-types',y.id,`<input name="name" value="${esc(y.name)}"><input type="color" name="color" value="${esc(y.color)}"><input type="number" name="default_lead_minutes" value="${y.default_lead_minutes}" min="0" max="240" style="max-width:80px">`,`<button class="chip" data-rm="appointment-types/${y.id}">🗑</button>`)).join('')}<div class="form" data-box><input name="name" placeholder="${t('name')}"><input type="color" name="color" value="#6366f1"><input type="number" name="default_lead_minutes" value="15" min="0" max="240"><button class="pri" data-mk="appointment-types">${t('addItem')}</button></div></div>
<div class="card"><b>${L=='de'?'Änderungsprotokoll':'Change log'}</b>${audit.map(x=>`<div class="li mu">${esc(x.at.slice(5,16).replace('T',' '))} · ${esc(x.user)} · ${esc(x.what)}</div>`).join('')}</div>`}

async function openChild(id){
 cur=id;const k=kids.find(x=>x.id==id);if(!k)return;
 const [ap,lg,ty]=await Promise.all([api('appointments?child_id='+id),api('logs?child_id='+id),api('appointment-types')]);types=ty;
 $('#dlg').innerHTML=`<div class="dh"><b>${esc(k.first_name)} ${esc(k.last_name)}</b>${badges(k)}<span class="sp"></span><button class="chip" data-close>✕</button></div>
 <div class="form" data-box><input name="first_name" value="${esc(k.first_name)}"><input name="last_name" value="${esc(k.last_name)}"><input name="group_name" list="gl2" value="${esc(k.group_name)}"><datalist id="gl2">${groups().map(g=>`<option value="${esc(g)}">`).join('')}</datalist><textarea name="info" rows="4" placeholder="${t('info')}">${esc(infoText(k))}</textarea><button class="pri" data-savekid>${t('save')}</button></div>
 <h4>📝 ${t('note')}</h4><div class="form"><input id="nn" placeholder="${t('note')}"><button class="pri" data-note>${t('addItem')}</button></div>
 <h4>${t('appts')}</h4>${ap.map(a=>`<div class="row"><div class="nm"><b>${esc(a.title)}</b> <span class="mu">${esc(a.category)} · ${a.is_recurring?DAYS[L][a.day_of_week]:a.date} ${a.start_time} · ${a.duration_minutes} min · 🔔 ${a.alert_lead_minutes}</span></div><button class="chip" data-rm="appointments/${a.id}">🗑</button></div>`).join('')}
 <div class="form" data-box><input name="title" placeholder="${t('title')}"><select name="category">${ty.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select><select name="day_of_week" data-num>${DAYS[L].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select><input name="date" type="date"><input name="start_time" type="time"><input name="duration_minutes" type="number" value="45" min="5"><input name="alert_lead_minutes" type="number" value="15" min="0"><label><input type="checkbox" name="is_recurring" checked> ${t('recur')}</label><button class="pri" data-addappt>${t('addItem')}</button></div>
 <h4>${t('today')}</h4>${lg.map(l=>`<div class="li"><span class="mu">${l.timestamp.slice(11,16)}</span> ${l.status?esc(l.status.icon)+' '+esc(l.status.label):''} ${l.note?'📝 '+esc(l.note):''}</div>`).join('')||'<span class="mu">–</span>'}`;
 if(!$('#dlg').open)$('#dlg').showModal()}
$('#dlg').addEventListener('click',e=>{if(e.target.id=='dlg')e.target.close()});

async function boot(){
 S=await api('public');L=S.language||'de';document.documentElement.lang=L;document.title=S.hort_name;applyS();
 if(!S.configured)return authView(true);
 if(!tok)return authView(false);
 try{me=await api('me');await load()}catch{return}
 shell();draw()}

function keepForms(fn){ // background refresh must never wipe a half-filled form
 const grid=()=>[...document.querySelectorAll('#main [data-box]')].map(b=>[...b.querySelectorAll('input,select,textarea')]);
 const snap=grid().map(g=>g.map(i=>i.type=='checkbox'||i.type=='radio'?i.checked:i.value));
 fn();
 grid().forEach((g,x)=>g.forEach((i,y)=>{const v=snap[x]&&snap[x][y];if(v===undefined||i.type=='file')return;if(i.type=='checkbox'||i.type=='radio')i.checked=v;else i.value=v}))}
setInterval(async()=>{ // keep several staff devices in sync
 if(!tok||document.hidden||!$('#main')||['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
 try{await load();if(!['manage','settings'].includes(tab)&&!$('#dlg').open)keepForms(draw)}catch{}},15000);
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
